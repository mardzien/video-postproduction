[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mido-sound-generator"
version = "1.0.0"
description = "MIDI-based sound generation module for Ball Game"
authors = [
    {name = "Ball Game Team"},
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "mido>=1.3.0",
    "pygame>=2.5.2",
    "midi2audio>=0.1.1",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "mypy>=1.8.0",
    "ruff>=0.3.0",
]

[project.scripts]
mido-generate = "generator:main"
mido-play = "main:main"

[tool.setuptools]
py-modules = ["generator", "main", "config", "logger"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.txt"]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
ignore_missing_imports = true
